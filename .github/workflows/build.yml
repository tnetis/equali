name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # esbuild ships a prebuilt binary; no runtime dependencies.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: |
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 required'); if(!m.version) throw new Error('missing version'); console.log('manifest ok', m.name, m.version)"
          test -f dist/icons/icon128.png
          test -f dist/background.js
          test -f dist/offscreen.html

      - name: Package zip
        run: |
          cd dist
          zip -r "../equali-${GITHUB_REF_NAME:-dev}.zip" . -x '*.DS_Store'

      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: equali-unpacked
          path: dist/**
          if-no-files-found: error

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: equali-zip
          path: equali-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download zip
        uses: actions/download-artifact@v4
        with:
          name: equali-zip
          path: release

      - name: List files
        run: ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/equali-*.zip
          generate_release_notes: true
