<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>harness</title>
    <link rel="stylesheet" href="/src/popup.css" />
    <style>
      body { background: #111; color: #eee; font: 13px system-ui; }
      #out { padding: 12px; }
    </style>
  </head>
  <body>
    <div id="out">pending</div>
    <script>
      window.__errors = [];
      window.addEventListener('error', (event) => window.__errors.push(String(event.message)));
      window.addEventListener('unhandledrejection', (event) =>
        window.__errors.push('rejection: ' + String((event.reason && event.reason.message) || event.reason))
      );

      const noop = () => {};
      window.chrome = {
        runtime: {
          sendMessage: async (message) => {
            if (message && message.type === 'GET_STATUS') return { active: false, tabId: null };
            return { ok: true };
          },
          connect: () => ({
            onMessage: { addListener: noop },
            onDisconnect: { addListener: noop },
            postMessage: noop
          }),
          onMessage: { addListener: noop },
          onConnect: { addListener: noop },
          onStartup: { addListener: noop },
          onInstalled: { addListener: noop }
        },
        storage: {
          local: { get: async () => ({}), set: async () => {} },
          session: { get: async () => ({}), set: async () => {}, remove: async () => {} }
        },
        tabs: {
          query: async () => [{ id: 1, url: 'https://www.youtube.com/watch?v=1', title: 'YouTube' }],
          onRemoved: { addListener: noop },
          onUpdated: { addListener: noop }
        },
        tabCapture: { getMediaStreamId: async () => 'stream-id' },
        action: { setBadgeText: async () => {}, setBadgeBackgroundColor: async () => {} },
        offscreen: { hasDocument: async () => false, createDocument: async () => {}, closeDocument: async () => {} },
        runtime2: {}
      };

      async function run() {
        const out = document.getElementById('out');
        try {
          const html = await (await fetch('/src/popup.html')).text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          for (const node of Array.from(doc.body.children)) {
            if (node.tagName === 'SCRIPT') continue;
            document.body.appendChild(document.importNode(node, true));
          }

          await import('/src/popup.js');
          await new Promise((resolve) => setTimeout(resolve, 400));

          window.__bands = document.querySelectorAll('.bandRange').length;
          window.__presets = document.querySelectorAll('#presetSelect option').length;
          window.__verify = !!(window.__bands === 10 && window.__presets > 30);

          // Load the other two modules to make sure they parse and register.
          await import('/src/background.js');
          await import('/src/offscreen.js');
          await new Promise((resolve) => setTimeout(resolve, 100));

          out.textContent = 'harness ran';
        } catch (error) {
          window.__errors.push('import: ' + String((error && error.message) || error));
          out.textContent = 'harness failed';
        }
        window.__done = true;
      }
      run();
    </script>
  </body>
</html>
